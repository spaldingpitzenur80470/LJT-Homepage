# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    outputs:
      pages_outcome: ${{ steps.pages.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      # Note: creating a GitHub Pages site via the API is not possible with the
      # default GITHUB_TOKEN (a PAT would be required), so this step is allowed
      # to fail while Pages is not yet enabled. The site is still built with
      # the repository baseurl below. To publish the site, enable Pages once
      # via Settings -> Pages -> Source: GitHub Actions; the deployment job
      # below then runs automatically on the next push or workflow run.
      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path || '/LJT-Homepage' }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    # Runs only once GitHub Pages is enabled and configured for this repository
    if: ${{ needs.build.outputs.pages_outcome == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
